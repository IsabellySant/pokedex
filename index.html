<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POKEDEX LINOW</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="quiz.css">
</head>

<body>

  <header class="cabecalho">
    <nav>
      <ul>
        <li><button class="ativo" id="abaPokemon">Pokémon</button></li>
        <li><button>Ataques</button></li>
        <li><button>Itens</button></li>
        <li><button id="abaFavoritos">Favoritos</button></li>
        <li><button class="quiz" aria-label="quizpokemon"> <img src="imagens/mimikyuquizz.png" alt="" width="32"
              height="32"></button></li>
      </ul>
    </nav>
  </header>

  <div class="pokedex-container">

    <aside class="barra-lateral">
      <img src="imagens/logo.png" alt="Logo Pokedex Linow">

      <div class="caixa-de-pesquisa">
        <h2>BUSCAR</h2>
        <input type="text" id="searchInput" placeholder="nome ou número">

        <div class="filtro">
          <label for="filtroTipo">Tipo</label>
          <select id="filtroTipo">
            <option value="">Todos</option>
            <option value="grass">Planta</option>
            <option value="fire">Fogo</option>
            <option value="water">Água</option>
            <option value="bug">Inseto</option>
            <option value="normal">Normal</option>
            <option value="poison">Veneno</option>
            <option value="electric">Elétrico</option>
            <option value="ground">Terra</option>
            <option value="fairy">Fada</option>
            <option value="fighting">Lutador</option>
            <option value="psychic">Psíquico</option>
            <option value="rock">Pedra</option>
            <option value="ghost">Fantasma</option>
            <option value="ice">Gelo</option>
            <option value="dragon">Dragão</option>
          </select>
        </div>

        <div class="filtro">
          <label for="filtroGeracao">Geração</label>
          <select id="filtroGeracao">
            <option value="">Todas</option>
            <option value="1">Geração 1</option>
            <option value="2">Geração 2</option>
            <option value="3">Geração 3</option>
            <option value="4">Geração 4</option>
            <option value="5">Geração 5</option>
            <option value="6">Geração 6</option>
            <option value="7">Geração 7</option>
            <option value="8">Geração 8</option>
            <option value="9">Geração 9</option>
          </select>
        </div>

        <div class="filtro">
          <label for="filtroRegiao">Região</label>
          <select id="filtroRegiao">
            <option value="">Todas</option>
            <option value="kanto">Kanto</option>
            <option value="johto">Johto</option>
            <option value="hoenn">Hoenn</option>
            <option value="sinnoh">Sinnoh</option>
            <option value="unova">Unova</option>
            <option value="kalos">Kalos</option>
            <option value="alola">Alola</option>
            <option value="galar">Galar</option>
            <option value="paldea">Paldea</option>
          </select>
        </div>

        <button type="button" id="limparFiltros" class="botao-limpar">Limpar filtros</button>
      </div>
    </aside>

    <!-- Conteúdo principal -->
    <main class="main">
      <div class="titulo-pagina">
        <h3 id="tituloLista">Todos os pokemons</h3>
        <p id="contador"></p>
      </div>

      <p id="semFavoritos" hidden>Você ainda não favoritou nenhum Pokémon.</p>

      <div class="pokemons" id="pokedex-lista">
        <!-- aqui vão os cards -->
      </div>
    </main>

    <aside class="detalhes" id="detalhes" aria-hidden="true">
      <div class="detalhes-interna">
        <button type="button" class="detalhes-fechar" id="detalhesFechar" aria-label="Fechar">✕</button>

        <img id="detImagem" alt="">
        <p id="detNumero"></p>
        <h2 id="detNome"></h2>
        <div id="detTipos" class="tipos"></div>

        <div class="det-medidas">
          <span>Altura<b id="detAltura"></b></span>
          <span>Peso<b id="detPeso"></b></span>
        </div>

        <h3>Status</h3>
        <div id="detStats"></div>
      </div>
    </aside>

  </div>

  
  <script src="script.js"></script>
  <script src="quiz.js"></script>

</body>

</html>
